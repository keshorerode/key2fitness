services:
  # ─── Backend (Express API) ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      # Persist CMS data across container restarts
      - cms-data:/app/data
    restart: unless-stopped

  # ─── Frontend (Next.js) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cms-data:
